<!DOCTYPE html>
<html>
<head>
    <title>Enhancement Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4DB6AC">
    <link rel="apple-touch-icon" href="public/assets/icons/icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --teal-primary: #4DB6AC;
            --teal-active: #26A69A;
            --sky-blue: #42A5F5;
            --sky-blue-dark: #2196F3;
            --bg-page: #F0FAF9;
            --card-bg: #FFFFFF;
            --text-primary: #263238;
            --text-secondary: #607D8B;
            --success: #43A047;
            --warning: #FFB300;
            --danger: #E53935;
            --border-light: #DCEFED;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            margin: 0;
            background: var(--bg-page);
            color: var(--text-primary);
        }
        .header {
            background: var(--teal-primary);
            color: white;
            padding: 14px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header a { color: white; text-decoration: none; font-size: 14px; }
        .header h1 { margin: 4px 0 0 0; font-size: clamp(17px, 4vw, 21px); }
        .header button {
            background: rgba(255,255,255,0.16);
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 4vw; }
        button {
            background: var(--sky-blue);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            min-height: 40px;
        }
        button:hover { background: var(--sky-blue-dark); }
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin: 18px 0 8px;
        }
        .section-title.due-now { color: var(--danger); }
        .section-title.due-later { color: #B8860B; }
        .patient-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 14px;
            margin: 10px 0;
            box-shadow: 0 2px 8px rgba(38,50,56,0.06);
            border-left: 5px solid #ccc;
        }
        .patient-card.overdue { border-left-color: var(--danger); background: #FDF3F2; }
        .patient-card.ok { border-left-color: var(--success); background: #F4FBF3; }
        .patient-card.never { border-left-color: var(--warning); background: #FFFCF2; }
        .patient-name { font-weight: 600; font-size: 15px; }
        .patient-name a { color: var(--text-primary); text-decoration: none; border-bottom: 1px dashed var(--teal-active); }
        .patient-name a:hover { color: var(--teal-active); }
        .patient-meta { font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
        .status-badge { font-size: 13px; font-weight: 600; margin: 6px 0; }
        .due-line { font-size: 14px; font-weight: 700; margin: 6px 0; }
        .due-line.red { color: var(--danger); }
        .due-line.amber { color: #B8860B; }
        .missing-photos { font-size: 13px; margin: 6px 0; font-weight: 600; }
        .missing-photos.has-missing { color: #B8860B; }
        .missing-photos.all-done { color: var(--success); }
        .history-list {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 8px 0;
            padding-left: 12px;
            border-left: 2px solid var(--border-light);
        }
        .history-list div { margin: 2px 0; }
        .btn-secondary {
            background: var(--card-bg);
            color: var(--teal-active);
            border: 1.5px solid #B9E4E0;
        }
        .btn-secondary:hover { background: #E8F7F5; }
        .backdate-box {
            background: #FBFEFE;
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
        }
        .backdate-box input[type="datetime-local"] {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            border: 1px solid #D3E7E5;
            border-radius: 8px;
            font-size: 15px;
            background: #FFFFFF;
        }
        .backdate-box .row-buttons {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }
        .backdate-status { font-size: 12px; margin-top: 6px; }
        details > summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--teal-active);
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <a href="patient-list.html">&larr; Back to list</a>
            <h1>Enhancement Tracker (Medicine only)</h1>
        </div>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container">
        <div class="top-bar">
            <p id="summary" style="margin:0; flex:1;"></p>
            <button onclick="downloadCsv()">Download Pending CSV (Ward-wise)</button>
        </div>
        <div id="list">Loading...</div>
    </div>

    <script>
        const SUPABASE_URL = "https://cqjqewlzxebszpnqhmev.supabase.co";
        const SUPABASE_KEY = "sb_publishable_rTd12RguCfNQYezz4febZA_xuIJW3OM";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const REQUIRED_SLOTS_MEDICINE = ["Patient Photo", "IPD Chart", "Drug Chart", "TPRB Chart"];

        let currentUserEmail = "";
        let inactivityTimer;
        let autoRefreshTimer;
        let lastResults = [];

        function parseUTC(dateStr) {
            if (!dateStr) return new Date();
            if (!dateStr.endsWith('Z') && !dateStr.includes('+')) {
                dateStr = dateStr + 'Z';
            }
            return new Date(dateStr);
        }

        function formatDateTime(dateStr) {
            return parseUTC(dateStr).toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' });
        }

        function esc(s) {
            return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        function istDateStr(d) {
            return d.toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
        }
        function istTime(d) {
            return d.toLocaleTimeString('en-GB', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' });
        }
        function istDateShort(d) {
            return d.toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
        }
        function formatDuration(ms) {
            const totalMin = Math.max(0, Math.round(ms / 60000));
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            if (h <= 0) return m + "m";
            if (m === 0) return h + "h";
            return h + "h " + m + "m";
        }

        function startInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(async () => {
                await supabaseClient.auth.signOut();
                alert("You were logged out due to 30 minutes of inactivity.");
                window.location.href = "index.html";
            }, 30 * 60 * 1000);
        }
        ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt => {
            document.addEventListener(evt, startInactivityTimer);
        });

        async function logout() {
            clearTimeout(inactivityTimer);
            await supabaseClient.auth.signOut();
            window.location.href = "index.html";
        }

        async function init() {
            const { data: sessionData } = await supabaseClient.auth.getSession();
            if (!sessionData.session) {
                window.location.href = "index.html";
                return;
            }
            currentUserEmail = sessionData.session.user.email;
            startInactivityTimer();
            loadTracker();

            // Auto-refresh every 5 minutes so a "due later today" countdown
            // automatically moves into "Due Now" once its time arrives,
            // without needing a manual reload.
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = setInterval(() => {
                if (document.visibilityState === 'visible') loadTracker();
            }, 5 * 60 * 1000);
        }

        async function loadTracker() {
            // Filter strictly for Medicine category patients who are active (not discharged)
            const { data: fetchedPatients, error: pErr } = await supabaseClient
                .from('Patients')
                .select('*')
                .eq('is_discharged', false)
                .eq('patient_category', 'Medicine');

            if (pErr || !fetchedPatients) {
                document.getElementById('list').innerText = "Error loading tracker: " + (pErr ? pErr.message : "Unknown error");
                return;
            }

            // Patients appear from the day AFTER their first Registration Photos capture.
            // If no registration photos exist yet, they show anyway.
            const todayForReg = istDateStr(new Date());
            const regDateByMrd = {};
            if (fetchedPatients.length > 0) {
                const { data: regPhotos } = await supabaseClient
                    .from('daily_photos')
                    .select('mrd, photo_date')
                    .eq('photo_type', 'Registration Photos')
                    .in('mrd', fetchedPatients.map(p => p.mrd));
                (regPhotos || []).forEach(r => {
                    if (!r.photo_date) return;
                    if (!regDateByMrd[r.mrd] || r.photo_date < regDateByMrd[r.mrd]) {
                        regDateByMrd[r.mrd] = r.photo_date;
                    }
                });
            }
            const patients = fetchedPatients.filter(p => {
                const regDate = regDateByMrd[p.mrd];
                return !regDate || regDate < todayForReg;
            });

            const activeMrds = patients.map(p => p.mrd);
            if (activeMrds.length === 0) {
                document.getElementById('summary').innerText = "No active medicine patients.";
                document.getElementById('list').innerHTML = "<p>No active medicine patients.</p>";
                lastResults = [];
                return;
            }

            const { data: logs, error: lErr } = await supabaseClient
                .from('enhancement_log')
                .select('mrd, marked_at, marked_by')
                .in('mrd', activeMrds)
                .order('marked_at', { ascending: true });

            const { data: dischargePhotos } = await supabaseClient
                .from('daily_photos')
                .select('mrd, uploaded_at')
                .eq('photo_type', 'Discharge Photo')
                .in('mrd', activeMrds);

            // Today's photos only, scoped to active Medicine patients and today's date,
            // used purely to work out which of the 4 required slots are still missing.
            const todayStr = istDateStr(new Date());
            const { data: todaysPhotos } = await supabaseClient
                .from('daily_photos')
                .select('mrd, photo_type')
                .in('mrd', activeMrds)
                .eq('photo_date', todayStr);

            if (lErr) {
                document.getElementById('list').innerText = "Error loading tracker logs.";
                return;
            }

            const dischargeMap = {};
            (dischargePhotos || []).forEach(dp => {
                if (!dischargeMap[dp.mrd] || dp.uploaded_at > dischargeMap[dp.mrd]) {
                    dischargeMap[dp.mrd] = dp.uploaded_at;
                }
            });

            const capturedTodayByMrd = {};
            (todaysPhotos || []).forEach(ph => {
                if (!capturedTodayByMrd[ph.mrd]) capturedTodayByMrd[ph.mrd] = new Set();
                capturedTodayByMrd[ph.mrd].add(ph.photo_type);
            });

            const now = new Date();

            const results = patients.map(p => {
                const patientLogs = (logs || []).filter(l => l.mrd === p.mrd);
                const lastLog = patientLogs.length > 0 ? patientLogs[patientLogs.length - 1] : null;
                const totalEnhancements = patientLogs.length;
                const lastDateForCsv = lastLog ? formatDateTime(lastLog.marked_at) : "";

                const capturedToday = capturedTodayByMrd[p.mrd] || new Set();
                const missingToday = REQUIRED_SLOTS_MEDICINE.filter(slot => !capturedToday.has(slot));

                if (dischargeMap[p.mrd]) {
                    const dt = parseUTC(dischargeMap[p.mrd]);
                    return {
                        patient: p, status: "dischargePending", subLabel: "Discharge photo captured",
                        totalEnhancements,
                        lastText: "Discharge photo captured on " + dt.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' }),
                        dueText: "Not needed", nextDueMs: Infinity,
                        patientLogs, lastDateForCsv, missingToday
                    };
                }

                if (!lastLog) {
                    return {
                        patient: p, status: "dueNow", subLabel: "Never enhanced",
                        totalEnhancements,
                        lastText: "Never enhanced",
                        dueText: "Next due: Now (never enhanced before)", nextDueMs: -Infinity,
                        patientLogs, lastDateForCsv, missingToday
                    };
                }

                const lastTime = parseUTC(lastLog.marked_at);
                const nextDue = new Date(lastTime.getTime() + 48 * 60 * 60 * 1000);
                const lastText = "Last enhanced: " + lastTime.toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' }) + " by " + lastLog.marked_by;
                const nextDueText = istTime(nextDue) + ", " + istDateShort(nextDue);

                if (nextDue <= now) {
                    return {
                        patient: p, status: "dueNow", subLabel: "Overdue",
                        totalEnhancements, lastText,
                        dueText: "Next due: " + nextDueText + " (overdue)",
                        nextDueMs: nextDue.getTime(),
                        patientLogs, lastDateForCsv, missingToday
                    };
                }

                if (istDateStr(nextDue) === todayStr) {
                    return {
                        patient: p, status: "dueLaterToday", subLabel: "Due Later Today",
                        totalEnhancements, lastText,
                        dueText: "Next due: " + nextDueText,
                        nextDueMs: nextDue.getTime(),
                        patientLogs, lastDateForCsv, missingToday
                    };
                }

                return {
                    patient: p, status: "notToday", subLabel: "Not due today",
                    totalEnhancements, lastText,
                    dueText: "Next due: " + nextDueText,
                    nextDueMs: nextDue.getTime(),
                    patientLogs, lastDateForCsv, missingToday
                };
            });

            const dueNow = results.filter(r => r.status === "dueNow")
                .sort((a, b) => a.nextDueMs - b.nextDueMs);
            const dueLaterToday = results.filter(r => r.status === "dueLaterToday")
                .sort((a, b) => a.nextDueMs - b.nextDueMs);
            const notToday = results.filter(r => r.status === "notToday")
                .sort((a, b) => a.nextDueMs - b.nextDueMs);
            const dischargePending = results.filter(r => r.status === "dischargePending");

            lastResults = results;

            document.getElementById('summary').innerText =
                `${dueNow.length} due now, ${dueLaterToday.length} due later today, ${results.length} active medicine patients.`;

            function cardHtml(r) {
                const p = r.patient;
                const cardClassMap = { dueNow: "overdue", dueLaterToday: "never", notToday: "ok", dischargePending: "ok" };
                const dueLineClassMap = { dueNow: "red", dueLaterToday: "amber", notToday: "", dischargePending: "" };
                const buttonHtml = (r.status === "dueNow")
                    ? `<button onclick="markEnhanced('${p.mrd}')">Mark Enhanced</button>`
                    : `<button disabled style="background:#B0BEC5; cursor:not-allowed;">${r.status === "dischargePending" ? "No longer needed" : "Not due yet"}</button>`;

                const missingHtml = r.missingToday.length === 0
                    ? `<div class="missing-photos all-done">&#10003; All captured today</div>`
                    : `<div class="missing-photos has-missing">Missing today: ${r.missingToday.join(", ")}</div>`;

                const safeMrdAttr = esc(p.mrd);
                return `
                    <div class="patient-card ${cardClassMap[r.status]}">
                        <div class="patient-name"><a href="patient.html?mrd=${encodeURIComponent(p.mrd)}">${esc(p.name)}</a> (MRD: ${esc(p.mrd)})</div>
                        <div class="patient-meta">Ward: ${esc(p.ward)} | ${esc(p.patient_category || "-")}</div>
                        <div class="status-badge">${esc(r.subLabel)}</div>
                        <div class="due-line ${dueLineClassMap[r.status]}">${esc(r.dueText)}</div>
                        ${missingHtml}
                        <div class="patient-meta">${esc(r.lastText)}</div>
                        <div class="patient-meta">Total times enhancement marked: ${r.totalEnhancements}</div>
                        ${buttonHtml}
                        <button class="btn-secondary" style="margin-top:6px;" onclick="toggleBackdateForm('${safeMrdAttr}')">+ Add Missed Enhancement</button>
                        <div id="backdateBox_${safeMrdAttr}" class="backdate-box" style="display:none;">
                            <label style="font-size:13px; color:var(--text-secondary);">When was it actually done?</label>
                            <input type="datetime-local" id="backdateInput_${safeMrdAttr}">
                            <div class="row-buttons">
                                <button onclick="submitBackdate('${safeMrdAttr}')">Save</button>
                                <button class="btn-secondary" onclick="toggleBackdateForm('${safeMrdAttr}')">Cancel</button>
                            </div>
                            <div id="backdateStatus_${safeMrdAttr}" class="backdate-status"></div>
                        </div>
                    </div>
                `;
            }

            let html = "";

            html += `<div class="section-title due-now">Due Now (${dueNow.length})</div>`;
            html += dueNow.length ? dueNow.map(cardHtml).join('') : `<p class="patient-meta">Nothing due right now.</p>`;

            html += `<div class="section-title due-later">Due Later Today (${dueLaterToday.length})</div>`;
            html += dueLaterToday.length ? dueLaterToday.map(cardHtml).join('') : `<p class="patient-meta">Nothing else due today.</p>`;

            const tucked = notToday.concat(dischargePending);
            if (tucked.length > 0) {
                html += `<details style="margin-top:14px;"><summary>Not needed today (${tucked.length})</summary>` +
                    `<div style="margin-top:10px;">` + tucked.map(cardHtml).join('') + `</div></details>`;
            }

            document.getElementById('list').innerHTML = html;
        }

        async function markEnhanced(mrd) {
            const { error } = await supabaseClient
                .from('enhancement_log')
                .insert([{ mrd: mrd, marked_by: currentUserEmail }]);

            if (error) {
                alert("Error: " + error.message);
                return;
            }
            loadTracker();
        }

        function localDateTimeNowValue() {
            const d = new Date();
            const pad = n => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
                   'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
        }

        function toggleBackdateForm(mrd) {
            const box = document.getElementById('backdateBox_' + mrd);
            if (!box) return;
            const opening = box.style.display === "none";
            box.style.display = opening ? "block" : "none";
            if (opening) {
                const input = document.getElementById('backdateInput_' + mrd);
                input.max = localDateTimeNowValue();
                input.value = localDateTimeNowValue();
                document.getElementById('backdateStatus_' + mrd).innerText = "";
            }
        }

        async function submitBackdate(mrd) {
            const input = document.getElementById('backdateInput_' + mrd);
            const status = document.getElementById('backdateStatus_' + mrd);
            const val = input.value;

            if (!val) {
                status.innerText = "Pick a date and time first.";
                return;
            }

            const chosen = new Date(val);
            if (isNaN(chosen.getTime())) {
                status.innerText = "That date/time doesn't look valid.";
                return;
            }
            if (chosen.getTime() > Date.now()) {
                status.innerText = "This can't be in the future.";
                return;
            }

            const { error } = await supabaseClient
                .from('enhancement_log')
                .insert([{
                    mrd: mrd,
                    marked_by: currentUserEmail + " (backdated)",
                    marked_at: chosen.toISOString()
                }]);

            if (error) {
                status.innerText = "Error: " + error.message;
                return;
            }

            loadTracker();
        }

        function downloadCsv() {
            if (!lastResults || lastResults.length === 0) {
                alert("No data to download.");
                return;
            }

            const dueNowList = lastResults.filter(r => r.status === "dueNow");
            const dueLaterList = lastResults.filter(r => r.status === "dueLaterToday");

            if (dueNowList.length === 0 && dueLaterList.length === 0) {
                alert("No patients due today.");
                return;
            }

            const byWardThenName = (a, b) => {
                const w = (a.patient.ward || "").localeCompare(b.patient.ward || "");
                if (w !== 0) return w;
                return (a.patient.name || "").localeCompare(b.patient.name || "");
            };

            const header = ["Ward", "Bed", "MRD", "Name", "Due"];

            function toRow(r) {
                const p = r.patient;
                return [
                    p.ward || "",
                    p.bed_no || "",
                    p.mrd || "",
                    p.name || "",
                    r.dueText
                ].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(",");
            }

            const csvLines = [header.join(",")];

            csvLines.push(`"DUE NOW (${dueNowList.length})",,,,`);
            [...dueNowList].sort(byWardThenName).forEach(r => csvLines.push(toRow(r)));

            csvLines.push(`"DUE LATER TODAY (${dueLaterList.length})",,,,`);
            [...dueLaterList].sort(byWardThenName).forEach(r => csvLines.push(toRow(r)));

            const csv = csvLines.join("\n");
            const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "due-today-enhancement-medicine-" + new Date().toISOString().slice(0,10) + ".csv";
            a.click();
            URL.revokeObjectURL(url);
        }

        init();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
