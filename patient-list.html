<!DOCTYPE html>
<html>
<head>
    <title>Patient Data Module - RKMSP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4DB6AC">
  <link rel="apple-touch-icon" href="public/assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="public/assets/css/modern-theme.css">
  <script src="public/assets/js/icons.js"></script>
  <style>
    :root {
      --teal-primary: #4DB6AC;
      --teal-active: #26A69A;
      --sky-blue: #42A5F5;
      --sky-blue-dark: #2196F3;
      --bg-page: #F0FAF9;
      --card-bg: #FFFFFF;
      --text-primary: #263238;
      --text-secondary: #607D8B;
      --success: #43A047;
      --warning: #FFB300;
      --danger: #E53935;
      --border-light: #DCEFED;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    .header {
      background: var(--teal-primary);
      color: white;
      padding: 14px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 1px 6px rgba(38,50,56,0.12);
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-brand img {
      height: 100px;
      width: auto;
      display: block;
      background: rgba(255,255,255,0.9);
      border-radius: 8px;
      padding: 3px 5px;
    }
    .header h1 {
      margin: 0;
      font-size: clamp(15px, 3.6vw, 21px);
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .header button {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
    }
    .header button:hover { background: rgba(255,255,255,0.28); }
    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 4vw;
    }
    #login-box {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 7vw 6vw;
      margin-top: 48px;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 4px 20px rgba(38,50,56,0.08);
      border-top: 4px solid var(--teal-primary);
    }
    #login-box h2 { margin-top: 0; color: var(--text-primary); }
    label, strong { color: var(--text-primary); }
    input[type="email"], input[type="password"], input[type="text"], input[type="date"], select {
      width: 100%;
      padding: 12px;
      margin: 6px 0 12px 0;
      border: 1px solid #D3E7E5;
      border-radius: 8px;
      font-size: 16px;
      min-height: 44px;
      background: #FBFEFE;
      color: var(--text-primary);
    }
    input:focus, select:focus {
      outline: none;
      border-color: var(--teal-active);
      box-shadow: 0 0 0 3px rgba(38,166,154,0.15);
    }
    button {
      background: var(--sky-blue);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      min-height: 44px;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--sky-blue-dark); }
    .btn-secondary {
      background: var(--card-bg);
      color: var(--teal-active);
      border: 1.5px solid #B9E4E0;
    }
    .btn-secondary:hover { background: #E8F7F5; }
    .top-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .top-actions input[type="text"] {
      flex: 1 1 200px;
      margin: 0;
    }
    #filterPanel {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      border: 1px solid var(--border-light);
    }
    .filter-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .chip-group label {
      display: inline-flex;
      align-items: center;
      padding: 7px 13px;
      margin: 0;
      border-radius: 20px;
      border: 1.5px solid #D3E7E5;
      background: #FBFEFE;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      user-select: none;
    }
    .chip-group label.active {
      background: var(--teal-active);
      border-color: var(--teal-active);
      color: white;
      font-weight: 600;
    }
    .chip-group input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      accent-color: var(--teal-active);
    }
    #addForm {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 18px;
      margin: 12px 0;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      max-width: 480px;
      border: 1px solid var(--border-light);
    }
    #addForm h3 { margin-top: 0; color: var(--text-primary); }
    #patientList {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 14px;
    }
    .patient-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
      border-left: 5px solid #CFE3E1;
      text-decoration: none;
      color: var(--text-primary);
      display: block;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .patient-card:hover {
      box-shadow: 0 4px 14px rgba(38,50,56,0.12);
      transform: translateY(-1px);
    }
    .patient-card.complete { border-left-color: var(--success); background: #F4FBF3; }
    .patient-card.incomplete { border-left-color: var(--warning); background: #FFFCF2; }
    .patient-name { font-size: clamp(15px, 3vw, 17px); font-weight: 600; word-break: break-word; }
    .patient-meta { font-size: 13px; color: var(--text-secondary); margin: 4px 0; }
    .status-line { font-size: 13px; font-weight: 600; margin-top: 8px; }
    .status-complete { color: var(--success); }
    .status-incomplete { color: #B8860B; }

    @media (min-width: 600px) {
      .container { padding: 24px; }
      #patientList { grid-template-columns: repeat(2, 1fr); }
      #addForm { padding: 20px; }
    }

    @media (min-width: 1024px) {
      .header { padding: 16px 40px; }
      .container { padding: 32px 40px; }
      #patientList { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>

    function doctorUnitLabel(code) {
      if (!code) return "Not assigned";
      for (const g of DOCTOR_UNIT_GROUPS) {
        const u = g.units.find(x => x.value === code);
        if (u) return u.label;
      }
      return code;
    }

    let allPatients = [];
    let allPhotosToday = [];
    let currentUserEmail = "";
    let isAdmin = false;
    let inactivityTimer;

    function startInactivityTimer() {
      clearTimeout(inactivityTimer);
      inactivityTimer = setTimeout(async () => {
        await supabaseClient.auth.signOut();
        alert("You were logged out due to 30 minutes of inactivity.");
        window.location.href = "index.html";
      }, 30 * 60 * 1000);
    }
    ['mousemove', 'keydown', 'touchstart', 'click', 'scroll'].forEach(evt => {
      document.addEventListener(evt, startInactivityTimer);
    });

    async function logout() {
      clearTimeout(inactivityTimer);
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    async function initApp() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "index.html";
        return;
      }
      currentUserEmail = sessionData.session.user.email;

      const { data: roleRow } = await supabaseClient
        .from('staff_roles').select('is_admin')
        .eq('user_id', sessionData.session.user.id).maybeSingle();
      isAdmin = !!(roleRow && roleRow.is_admin);
      const delBtn = document.getElementById('recentlyDeletedBtn');
      if (delBtn) delBtn.style.display = isAdmin ? "inline-block" : "none";

      document.getElementById('app').style.display = "block";
      startInactivityTimer();
      buildFilterChips();
      restoreFilterState();
      await loadPatients();
    }

    function toggleLosField() {
      const cat = document.getElementById('newCategory').value;
      document.getElementById('newLosWrap').style.display = cat === "Medicine" ? "none" : "block";
    }

    function toggleChipGroup(groupId, chevronId) {
      const group = document.getElementById(groupId);
      const chevron = document.getElementById(chevronId);
      const isOpen = group.style.display === "flex" || group.style.display === "block";
      group.style.display = isOpen ? "none" : "flex";
      chevron.innerHTML = isOpen ? "&#9656;" : "&#9662;";
    }

    function syncChipHighlights() {
      document.querySelectorAll('.chip-group input[type="checkbox"]').forEach(cb => {
        cb.closest('label').classList.toggle('active', cb.checked);
      });
    }

    function buildFilterChips() {
      // Wards
      const wards = ["NICU 1","NICU 2","PICU","CW-CTVS","A2","A3","B1","B2","B3","C2","C3","C5","PWM","PWS","GE","CW","EXT CW","HDU I","CCU","ICU","HDUII"];
      document.getElementById('wardCheckboxes').innerHTML = wards.map(w =>
        `<label><input type="checkbox" value="${w}" onchange="filterList()"> ${w}</label>`
      ).join('');

      // Categories
      const cats = ["Medicine","OT","Dialysis","Chemo"];
      document.getElementById('categoryCheckboxes').innerHTML = cats.map(c =>
        `<label><input type="checkbox" value="${c}" onchange="filterList()"> ${c}</label>`
      ).join('');

      // Doctor Units: grouped by specialty, each collapsed by default
      document.getElementById('unitCheckboxes').innerHTML =
        DOCTOR_UNIT_GROUPS.map((g, gi) => `
          <div class="filter-section-title" style="font-size:11px; margin:4px 0 4px; text-transform:none;" onclick="toggleChipGroup('unitGroup_${gi}','unitChevron_${gi}')">${g.specialty} <span id="unitChevron_${gi}">&#9656;</span></div>
          <div id="unitGroup_${gi}" class="chip-group" style="display:none; margin-bottom:6px;">
            ${g.units.map(u => `<label><input type="checkbox" value="${u.value}" onchange="filterList()"> ${u.label}</label>`).join('')}
          </div>
        `).join('') +
        `<label><input type="checkbox" value="__none__" onchange="filterList()"> Not assigned</label>`;
    }

    async function addPatient() {
      const mrd = document.getElementById('newMrd').value.trim();
      const pmjay_id = document.getElementById('newPmjayId').value.trim() || null;
      const name = document.getElementById('newName').value.trim();
      const ward = document.getElementById('newWard').value;
      const bed_no = document.getElementById('newBed').value.trim();
      const doctor_unit = document.getElementById('newDoctorUnit').value || null;
      const admission_date = document.getElementById('newAdmissionDate').value;
      const patient_category = document.getElementById('newCategory').value;
      const los_raw = document.getElementById('newLos').value;
      const los_days = (patient_category !== "Medicine" && los_raw) ? parseInt(los_raw) : null;
      const addMessage = document.getElementById('addMessage');

      if (!mrd || !name) {
        addMessage.innerText = "MRD and Name are required.";
        return;
      }

      const { error } = await supabaseClient
        .from('Patients')
        .insert([{ mrd, name, ward, bed_no, doctor_unit, admission_date, patient_category, pmjay_id, los_days, los_start_date: los_days ? admission_date : null, is_discharged: false }]);

      if (error) {
        addMessage.innerText = "Error: " + error.message;
      } else {
        addMessage.innerText = "Patient added!";
        document.getElementById('newMrd').value = "";
        document.getElementById('newPmjayId').value = "";
        document.getElementById('newName').value = "";
        document.getElementById('newWard').value = "";
        document.getElementById('newBed').value = "";
        document.getElementById('newDoctorUnit').value = "";
        document.getElementById('newAdmissionDate').value = "";
        loadPatients();
      }
    }

    async function loadPatients() {
      const { data, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .order('name', { ascending: true });

      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });

      const activeMrds = (data || []).filter(p => !p.is_discharged).map(p => p.mrd);
      const { data: photoData, error: photoError } = activeMrds.length
        ? await supabaseClient
            .from('daily_photos')
            .select('mrd, photo_type, photo_date, uploaded_at')
            .in('mrd', activeMrds)
        : { data: [], error: null };

      if (!photoError && photoData) {
        allPhotosToday = photoData;
      }

      if (!error && data) {
        // Active patients first, discharged at the bottom. Within each group sort by name.
        allPatients = data.slice().sort((a, b) => {
          const aDischarged = a.is_discharged ? 1 : 0;
          const bDischarged = b.is_discharged ? 1 : 0;
          if (aDischarged !== bDischarged) return aDischarged - bDischarged;
          return (a.name || "").localeCompare(b.name || "");
        });
        filterList();
        updateActiveCountBadge();
      } else {
        document.getElementById('patientList').innerHTML =
          "<p>Error loading patients" + (error ? ": " + error.message : ".") + "</p>";
      }
    }

    function getPatientStatus(p) {
      if (p.is_discharged) return null;
      if (allPhotosToday.some(ph => ph.mrd === p.mrd && ph.photo_type === "Discharge Photo")) return null;

      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      const patientPhotos = allPhotosToday.filter(ph => ph.mrd === p.mrd);

      if (p.patient_category === "OT") {
        const hasProcedurePhoto = patientPhotos.some(ph => PROCEDURE_SLOTS.includes(ph.photo_type));
        if (hasProcedurePhoto) {
          return { otDone: true };
        }
        const relevantPhotos = patientPhotos.filter(ph => {
          if (!ph.uploaded_at) return false;
          let s = ph.uploaded_at;
          if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
          const d = new Date(s).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
          return d === today;
        });
        const capturedTypes = new Set(relevantPhotos.map(ph => ph.photo_type));
        const missing = OT_DAILY_SLOTS.filter(slot => !capturedTypes.has(slot));
        return { done: OT_DAILY_SLOTS.length - missing.length, total: OT_DAILY_SLOTS.length, missing, isDaily: true };
      }

      const required = REQUIRED_SLOTS[p.patient_category] || [];
      const isDaily = p.patient_category === "Medicine";

      const relevantPhotos = isDaily
        ? patientPhotos.filter(ph => {
            if (!ph.uploaded_at) return false;
            let s = ph.uploaded_at;
            if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
            const d = new Date(s).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
            return d === today;
          })
        : patientPhotos;

      const capturedTypes = new Set(relevantPhotos.map(ph => ph.photo_type));
      const missing = required.filter(slot => !capturedTypes.has(slot));

      return {
        done: required.length - missing.length,
        total: required.length,
        missing,
        isDaily
      };
    }

    function dischargeHtml(p) {
      if (p.is_discharged) return "";
      const dp = allPhotosToday
        .filter(ph => ph.mrd === p.mrd && ph.photo_type === "Discharge Photo")
        .sort((a, b) => (a.uploaded_at < b.uploaded_at ? 1 : -1))[0];
      if (!dp) return "";
      let dateText = "";
      if (dp.uploaded_at) {
        let s = dp.uploaded_at;
        if (!s.endsWith('Z') && !s.includes('+')) s += 'Z';
        dateText = " on " + new Date(s).toLocaleDateString('en-GB', { timeZone: 'Asia/Kolkata', day: 'numeric', month: 'short' });
      }
      return `<div class="status-line status-complete">&#10003; Discharge photo captured${dateText}</div>`;
    }

    function losHtml(p) {
      if (p.is_discharged || !p.los_days || p.patient_category === "Medicine" || !p.admission_date) return "";
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      const losStart = p.los_start_date || p.admission_date;
      const dayNo = Math.round((new Date(today) - new Date(losStart)) / 86400000) + 1;
      const left = p.los_days - dayNo;
      if (left < 0) return `<div class="status-line" style="color:#E53935;">&#9888; LOS EXCEEDED by ${-left} day(s). Discharge and readmit on paper.</div>`;
      if (left === 0) return `<div class="status-line" style="color:#B8860B;">&#9888; LOS ends today (Day ${dayNo} of ${p.los_days})</div>`;
      return `<div class="status-line" style="color:#607D8B;">LOS: Day ${dayNo} of ${p.los_days}</div>`;
    }

    function renderList(patients) {
      const listDiv = document.getElementById('patientList');
      if (patients.length === 0) {
        listDiv.innerHTML = "<p>No patients found.</p>";
        return;
      }
      listDiv.innerHTML = patients.map(p => {
        const status = getPatientStatus(p);
        let trackingHtml = "";
        let cardClass = "";
        if (status) {
          if (status.otDone) {
            trackingHtml = `<div class="status-line status-complete">&#10003; OT DONE</div>`;
            cardClass = "complete";
          } else {
            const label = status.isDaily ? "today" : "overall";
            if (status.missing.length === 0) {
              trackingHtml = `<div class="status-line status-complete">${status.done}/${status.total} done ${label} — All complete</div>`;
              cardClass = "complete";
            } else {
              trackingHtml = `<div class="status-line status-incomplete">${status.done}/${status.total} done ${label} — Missing: ${status.missing.join(", ")}</div>`;
              cardClass = "incomplete";
            }
          }
        }

        const unitText = doctorUnitLabel(p.doctor_unit);

        return `
          <a href="patient.html?mrd=${p.mrd}" class="patient-card ${cardClass}">
            <div class="patient-name">${p.name} <span style="font-weight:400; color:#777;">(MRD: ${p.mrd} | PMJAY: ${p.pmjay_id || "-"})</span></div>
            <div class="patient-meta">Ward: ${p.ward || "Not assigned"} | Bed: ${p.bed_no || "Not assigned"} | Unit: ${unitText} | ${p.patient_category || "-"} | ${p.is_discharged ? "Discharged" : "Active"}</div>
            ${trackingHtml}${dischargeHtml(p)}${losHtml(p)}
          </a>
        `;
      }).join('');
    }

    function saveFilterState() {
      const state = {
        search: document.getElementById('searchInput').value,
        wards: Array.from(document.querySelectorAll('#wardCheckboxes input:checked')).map(cb => cb.value),
        categories: Array.from(document.querySelectorAll('#categoryCheckboxes input:checked')).map(cb => cb.value),
        units: Array.from(document.querySelectorAll('#unitCheckboxes input:checked')).map(cb => cb.value)
      };
      sessionStorage.setItem('rkm_filter_state', JSON.stringify(state));
    }

    function restoreFilterState() {
      const raw = sessionStorage.getItem('rkm_filter_state');
      if (!raw) return;
      try {
        const state = JSON.parse(raw);
        document.getElementById('searchInput').value = state.search || "";
        document.querySelectorAll('#wardCheckboxes input').forEach(cb => cb.checked = (state.wards || []).includes(cb.value));
        document.querySelectorAll('#categoryCheckboxes input').forEach(cb => cb.checked = (state.categories || []).includes(cb.value));
        document.querySelectorAll('#unitCheckboxes input').forEach(cb => cb.checked = (state.units || []).includes(cb.value));
        syncChipHighlights();
      } catch (e) {}
    }

    function filterList() {
      syncChipHighlights();
      saveFilterState();
      const query = document.getElementById('searchInput').value.toLowerCase();

      const selectedWards = Array.from(document.querySelectorAll('#wardCheckboxes input:checked')).map(cb => cb.value);
      const selectedCategories = Array.from(document.querySelectorAll('#categoryCheckboxes input:checked')).map(cb => cb.value);
      const selectedUnits = Array.from(document.querySelectorAll('#unitCheckboxes input:checked')).map(cb => cb.value);

      const activeCount = selectedWards.length + selectedCategories.length + selectedUnits.length;
      const badge = document.getElementById('filterCountBadge');
      if (badge) badge.innerText = activeCount > 0 ? '(' + activeCount + ')' : '';

      const filtered = allPatients.filter(p => {
        const matchesSearch = (p.name || "").toLowerCase().includes(query) || (p.mrd || "").toLowerCase().includes(query);
        const matchesWard = selectedWards.length === 0 || selectedWards.includes(p.ward);
        const matchesCategory = selectedCategories.length === 0 || selectedCategories.includes(p.patient_category);
        let matchesUnit = true;
        if (selectedUnits.length > 0) {
          const hasNone = selectedUnits.includes("__none__");
          const realUnits = selectedUnits.filter(u => u !== "__none__");
          matchesUnit = (hasNone && !p.doctor_unit) || realUnits.includes(p.doctor_unit);
        }
        return matchesSearch && matchesWard && matchesCategory && matchesUnit;
      });

      renderList(filtered);
    }

    function clearFilters() {
      document.getElementById('searchInput').value = "";
      document.querySelectorAll('#wardCheckboxes input, #categoryCheckboxes input, #unitCheckboxes input').forEach(cb => cb.checked = false);
      syncChipHighlights();
      filterList();
    }

    // "Active" for export means not discharged AND no Discharge Photo
    // captured yet — once a discharge photo exists, that patient no longer
    // needs daily tracking and shouldn't appear on the active list.
    function getActiveForExport() {
      return allPatients.filter(p => !p.is_discharged &&
        !allPhotosToday.some(ph => ph.mrd === p.mrd && ph.photo_type === "Discharge Photo"));
    }

    function updateActiveCountBadge() {
      const badge = document.getElementById('activeCountBadge');
      if (badge) badge.innerText = '(' + getActiveForExport().length + ')';
    }

    function previewActiveList() {
      const sorted = getActiveForExport().slice().sort((a, b) => {
        const w = (a.ward || "").localeCompare(b.ward || "");
        if (w !== 0) return w;
        return (a.name || "").localeCompare(b.name || "");
      });
      document.getElementById('previewCount').innerText = '(' + sorted.length + ')';
      document.getElementById('previewTableBody').innerHTML = sorted.map(p => `
        <tr style="border-bottom:1px solid var(--border-light);">
          <td style="padding:6px 4px;">${p.ward || "-"}</td>
          <td style="padding:6px 4px;">${p.bed_no || "-"}</td>
          <td style="padding:6px 4px;">${p.mrd}</td>
          <td style="padding:6px 4px;">${p.name}</td>
          <td style="padding:6px 4px;">${p.patient_category || "-"}</td>
          <td style="padding:6px 4px;">${doctorUnitLabel(p.doctor_unit)}</td>
        </tr>
      `).join('');
      document.getElementById('activePreviewModal').style.display = 'flex';
    }

    function closeActivePreview() {
      document.getElementById('activePreviewModal').style.display = 'none';
    }

    function downloadActiveCsv() {
      const active = getActiveForExport();
      if (active.length === 0) {
        alert("No active patients to download.");
        return;
      }

      const sorted = active.slice().sort((a, b) => {
        const w = (a.ward || "").localeCompare(b.ward || "");
        if (w !== 0) return w;
        return (a.name || "").localeCompare(b.name || "");
      });

      const header = ["Ward", "Bed", "MRD", "Name", "PMJAY", "Doctor Unit", "Category", "Admission Date"];
      const rows = sorted.map(p => [
        p.ward || "",
        p.bed_no || "",
        p.mrd || "",
        p.name || "",
        p.pmjay_id || "",
        doctorUnitLabel(p.doctor_unit),
        p.patient_category || "",
        p.admission_date || ""
      ].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(","));

      const csv = [header.join(",")].concat(rows).join("\n");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "active-patients-wardwise-" + new Date().toISOString().slice(0,10) + ".csv";
      a.click();
      URL.revokeObjectURL(url);
    }

    function escHtml(s) {
      return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function closeDeletedModal() {
      document.getElementById('deletedModal').style.display = 'none';
    }

    async function openDeletedModal() {
      document.getElementById('deletedModal').style.display = 'flex';
      const listDiv = document.getElementById('deletedList');
      listDiv.innerText = "Loading...";

      const { data, error } = await supabaseClient
        .from('deleted_patients_archive')
        .select('id, mrd, patient_name, deleted_at, deleted_by')
        .order('deleted_at', { ascending: false });

      if (error) { listDiv.innerText = "Error: " + error.message; return; }

      const now = Date.now();
      const WEEK = 7 * 24 * 3600 * 1000;
      const live = (data || []).filter(r => now - new Date(r.deleted_at).getTime() < WEEK);

      if (live.length === 0) {
        listDiv.innerHTML = "<p>No recently deleted patients.</p>";
        return;
      }

      listDiv.innerHTML = live.map(r => {
        const daysLeft = Math.max(0, Math.ceil((WEEK - (now - new Date(r.deleted_at).getTime())) / 86400000));
        const when = new Date(r.deleted_at).toLocaleString('en-GB', { timeZone: 'Asia/Kolkata' });
        return `
          <div style="padding:10px 0; border-bottom:1px solid var(--border-light);">
            <div style="font-weight:600;">${escHtml(r.patient_name)} <span style="font-weight:400; color:#777;">(MRD: ${escHtml(r.mrd)})</span></div>
            <div class="patient-meta">Deleted ${when} by ${escHtml(r.deleted_by || "unknown")} &mdash; ${daysLeft} day(s) left to restore</div>
            <button onclick="restoreDeleted(${r.id})" style="margin-top:6px;">Restore</button>
          </div>
        `;
      }).join('');
    }

    async function restoreDeleted(archiveId) {
      if (!confirm('Restore this patient and all their data?')) return;
      const { error } = await supabaseClient.rpc('admin_restore_patient', { p_archive_id: archiveId });
      if (error) {
        alert("Could not restore: " + error.message);
        return;
      }
      alert("Patient restored.");
      await loadPatients();
      openDeletedModal();
    }

    // Check session on load
    initApp();

    // When the browser restores this page from the Back button instead of
    // reloading it, 'initApp' at the top doesn't run again — this catches
    // that case and refreshes the list and filters.
    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        initApp();
      }
    });
  </script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
