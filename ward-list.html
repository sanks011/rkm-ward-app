<!DOCTYPE html>
<html>
<head>
    <title>Ward-wise Patient List</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4DB6AC">
  <link rel="apple-touch-icon" href="public/assets/icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="public/assets/css/modern-theme.css">
  <script src="public/assets/js/icons.js"></script>
  <style>
    :root {
      --teal-primary: #4DB6AC;
      --sky-blue: #42A5F5;
      --sky-blue-dark: #2196F3;
      --bg-page: #F0FAF9;
      --card-bg: #FFFFFF;
      --text-primary: #263238;
      --text-secondary: #607D8B;
      --border-light: #DCEFED;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 0;
      background: var(--bg-page);
      color: var(--text-primary);
    }
    .header {
      background: var(--teal-primary);
      color: white;
      padding: 14px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header a { color: white; text-decoration: none; font-size: 14px; }
    .header h1 { margin: 4px 0 0 0; font-size: clamp(17px, 4vw, 21px); }
    .header-actions button {
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.5);
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-left: 8px;
    }
    .container { max-width: 800px; margin: 0 auto; padding: 4vw; }
    .ward-section {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      margin: 14px 0;
      box-shadow: 0 2px 8px rgba(38,50,56,0.06);
    }
    .ward-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--teal-primary);
      border-bottom: 2px solid var(--border-light);
      padding-bottom: 6px;
      margin-bottom: 10px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 6px 8px;
      font-size: 14px;
      border-bottom: 1px solid var(--border-light);
    }
    th { color: var(--text-secondary); font-weight: 600; }

    @media print {
      .header-actions, .header a { display: none; }
      .header { background: white !important; color: black !important; box-shadow: none; }
      .header h1 { color: black; }
      body { background: white; }
      .ward-section { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <a href="ward.html">&larr; Back to Ward Module</a>
      <h1>Ward-wise Patient List</h1>
    </div>
    <div class="header-actions">
      <button onclick="window.print()">Print / Save</button>
    </div>
  </div>

  <div class="container">
    <p id="generatedOn"></p>
    <div id="wardLists">Loading...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://cqjqewlzxebszpnqhmev.supabase.co";
    const SUPABASE_KEY = "sb_publishable_rTd12RguCfNQYezz4febZA_xuIJW3OM";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function losText(p) {
      if (!p.los_days || p.patient_category === "Medicine" || !p.admission_date) return "-";
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
      const losStart = p.los_start_date || p.admission_date;
      const dayNo = Math.round((new Date(today) - new Date(losStart)) / 86400000) + 1;
      const left = p.los_days - dayNo;
      if (left < 0) return '<span style="color:#E53935; font-weight:700;">Exceeded +' + (-left) + '</span>';
      if (left === 0) return '<span style="color:#B8860B; font-weight:700;">Ends today</span>';
      return 'Day ' + dayNo + '/' + p.los_days;
    }

    async function init() {
      const { data: sessionData } = await supabaseClient.auth.getSession();
      if (!sessionData.session) {
        window.location.href = "index.html";
        return;
      }

      document.getElementById('generatedOn').innerText =
        "Generated: " + new Date().toLocaleString();

      const { data: patients, error } = await supabaseClient
        .from('Patients')
        .select('*')
        .eq('is_discharged', false)
        .order('ward', { ascending: true })
        .order('name', { ascending: true });

      if (error || !patients) {
        document.getElementById('wardLists').innerText = "Error loading patients.";
        return;
      }

      const grouped = {};
      patients.forEach(p => {
        const ward = p.ward || "Unassigned";
        if (!grouped[ward]) grouped[ward] = [];
        grouped[ward].push(p);
      });

      const wardNames = Object.keys(grouped).sort();

      if (wardNames.length === 0) {
        document.getElementById('wardLists').innerHTML = "<p>No active patients.</p>";
        return;
      }

      document.getElementById('wardLists').innerHTML = wardNames.map(ward => `
        <div class="ward-section">
          <div class="ward-title">Ward: ${ward} (${grouped[ward].length} patients)</div>
          <table>
            <tr><th>Name</th><th>MRD</th><th>PMJAY ID</th><th>Bed</th><th>Category</th><th>LOS</th></tr>
            ${grouped[ward].map(p => `
            <tr><td>${p.name}</td><td>${p.mrd}</td><td>${p.pmjay_id || "-"}</td><td>${p.bed_no || "-"}</td><td>${p.patient_category || "-"}</td><td>${losText(p)}</td></tr>
            `).join('')}
          </table>
        </div>
      `).join('');
    }

        init();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
